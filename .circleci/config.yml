version: 2.1

setup: true

orbs:
  continuation: circleci/continuation@2.0.1

jobs:
  generate-pipeline:
    docker:
      - image: cimg/go:1.22
    resource_class: large
    steps:
      - checkout:
          method: shallow
      - run:
          name: Generate pipeline
          command: |
            set -eu
            generator_dir="$(mktemp -d)"
            cleanup() {
              rm -rf "$generator_dir"
            }
            trap cleanup EXIT

            test -n "$GITLAB_TOKEN"
            echo "GitLab token received"
            askpass="$generator_dir/git-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$GITLAB_TOKEN"' > "$askpass"
            chmod 700 "$askpass"
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git clone --depth 1 https://axdoomer@gitlab.com/arctiq-team/alexandrelabonte/ci-pipeline-generation/ci-pipeline-generator.git "$generator_dir/source"
            echo "Generator cloned"
            (
              cd "$generator_dir/source"
              go build -o "$generator_dir/pipeline-generator" ./cmd/pipeline-generator
            )
            echo "Generator built"
            CIRCLECI=true \
              PIPELINE_SHALLOW_CLONE=true \
              PIPELINE_BUILD_IMAGE=ubuntu:latest \
              PIPELINE_INSTALL_PACKAGES="bc bison build-essential ccache dwarves flex git libelf-dev libncurses5-dev libssl-dev fakeroot debhelper" \
              "$generator_dir/pipeline-generator" generated-config.yml
            echo "Pipeline generated"
      - continuation/continue:
          configuration_path: generated-config.yml

workflows:
  generate:
    jobs:
      - generate-pipeline
