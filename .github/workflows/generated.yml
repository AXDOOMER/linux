name: Compile Linux Kernel

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 
        with:
          fetch-depth: 50

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            dwarves \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            fakeroot \
            debhelper 

      - name: Build kernel
        run: |
          make -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            arch/x86/boot/bzImage
            *.deb  # via bindeb-pkg
