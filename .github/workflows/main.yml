name: Pipeline generator
on:
  - push
  - pull_request
permissions: write-all
jobs:
  run-generator:
    runs-on: ubuntu-latest
    outputs:
      workflow-updated: ${{ steps.run-action.outputs.workflow-updated }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: "50"
          persist-credentials: false
      - name: Run pipeline-gen action
        id: run-action
        uses: GitHub-Accelerate/automatic-pipeline-generator-action@main
        with:
          fetch_depth: "50"
          packages_to_install: bc bison build-essential ccache dwarves flex git libelf-dev libncurses5-dev libssl-dev fakeroot debhelper
        env:
          GH_WORKFLOW_WRITE: ${{ secrets.GH_WORKFLOW_WRITE }}
  main:
    runs-on: ubuntu-latest
    needs: run-generator
    if: needs.run-generator.outputs.workflow-updated == 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: "50"
      - name: Scan for secrets with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          exit-code: "1"
          format: sarif
          output: trivy-secrets.sarif
          scan-ref: .
          scan-type: fs
          scanners: secret
          severity: CRITICAL,HIGH
      - name: Install build dependencies
        run: |-
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache dwarves flex git libelf-dev libncurses5-dev libssl-dev fakeroot debhelper
      - name: Build
        run: make -j$(nproc) build
      - name: Package build folder
        run: |
          zip -r build.zip ../build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip
