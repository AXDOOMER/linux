name: Pipeline generator
on:
  - push
  - pull_request
permissions: write-all
jobs:
  run-generator:
    runs-on: ubuntu-latest
    outputs:
      workflow-updated: ${{ steps.run-action.outputs.workflow-updated }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run pipeline-gen action
        id: run-action
        uses: GitHub-Accelerate/automatic-pipeline-generator-action@main
        env:
          GH_WORKFLOW_WRITE: ${{ secrets.GH_WORKFLOW_WRITE }}
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Build kernel
        run: |
          mkdir ../build
          gcc -Wall *.c -o ../build/myprogram
      - name: Package build folder
        run: |
          zip -r build.zip ../build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip
